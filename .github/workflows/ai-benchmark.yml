name: AI benchmark

on:
  push:
    paths:
      - "docs/benchmark/**"
      - "scripts/validate_benchmark.py"
      - "scripts/render_share_card.py"
      - "scripts/run_benchmark.py"
  pull_request:
    paths:
      - "docs/benchmark/**"
      - "scripts/validate_benchmark.py"
  workflow_dispatch:

jobs:
  validate:
    name: Validate committed benchmark artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: pip install pillow
      - name: Validate report + share cards
        run: python3 scripts/validate_benchmark.py
